<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Monitor | Indices Dashboard</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --text-color: #334155;
            --header-bg: #1e293b;
            --header-text: #f8fafc;
            --border-color: #e2e8f0;
            --hover-bg: #f1f5f9;
            --link-color: #2563eb;
            --index-bg: #f8fafc;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 20px; background-color: var(--bg-color); color: var(--text-color); }
        h1 { font-size: 24px; margin-bottom: 20px; color: #0f172a; }
        .controls-wrapper { display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; }
        .controls-row { display: flex; gap: 15px; flex-wrap: wrap; align-items: center; }
        input[type="text"], input[type="number"], select { padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 13px; outline: none; }
        input[type="text"]:focus, input[type="number"]:focus, select:focus { border-color: #94a3b8; box-shadow: 0 0 0 3px rgba(148, 163, 184, 0.2); }
        .filter-group { display: flex; align-items: center; gap: 8px; background: white; padding: 8px 15px; border-radius: 8px; border: 1px solid var(--border-color); box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .filter-label { font-size: 13px; font-weight: 600; color: #475569; }
        
        .table-container { background: white; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); overflow: auto; max-height: 80vh; position: relative;}
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        
        th, td { padding: 10px 15px; border-bottom: 1px solid var(--border-color); text-align: right; white-space: nowrap; vertical-align: middle; }
        th { background-color: var(--header-bg); color: var(--header-text); position: sticky; top: 0; cursor: pointer; user-select: none; z-index: 10; font-weight: 500; }
        th:hover { background-color: #334155; }
        
        /* Sticky First Column */
        th:nth-child(1), td:nth-child(1) { text-align: left; position: sticky; left: 0; }
        th:nth-child(1) { z-index: 13; background-color: var(--header-bg); }
        td:nth-child(1) { z-index: 2; background-color: white; border-right: 1px solid var(--border-color); }
        
        tr.stock-row:hover { background-color: var(--hover-bg); }
        tr.stock-row:hover td:nth-child(1) { background-color: var(--hover-bg); }
        
        tr.index-row { background-color: var(--index-bg); border-top: 2px solid #e2e8f0; cursor: pointer; }
        tr.index-row td:nth-child(1) { background-color: var(--index-bg); }
        tr.index-row:hover { background-color: #f1f5f9; }
        tr.index-row:hover td:nth-child(1) { background-color: #f1f5f9; }
        
        a { color: var(--link-color); text-decoration: none; font-weight: 500; }
        a:hover { text-decoration: underline; }
        
        .sort-icon { margin-left: 5px; font-size: 10px; }
        .ad-bar-container { width: 100%; max-width: 140px; margin-top: 6px; }
        .ad-bar-track { display: flex; height: 4px; border-radius: 2px; overflow: hidden; background: #e2e8f0; }
        .ad-labels { display: flex; justify-content: space-between; font-size: 11px; margin-top: 3px; }
        
        .toggle-btn { display: inline-flex; justify-content: center; align-items: center; width: 16px; height: 16px; border: 1px solid #cbd5e1; background: white; border-radius: 3px; font-size: 14px; color: #475569; font-weight: bold; line-height: 1; }
    </style>
</head>
<body>
    <h1>Market Monitor Dashboard</h1>
    <div class="controls-wrapper">
        <div class="controls-row">
            <input type="text" id="searchInput" placeholder="Search company or index..." style="min-width: 250px;">
            <select id="categoryFilter"><option value="All">All Categories</option></select>
            <select id="viewModeFilter">
                <option value="All">Show: All</option>
                <option value="Sectors">Show: Sectors Only</option>
                <option value="Stocks">Show: Stocks Only</option>
            </select>
        </div>
        <div class="controls-row">
            <div class="filter-group">
                <span class="filter-label">Filter Returns:</span>
                <select id="returnTimeframe">
                    <option value="1D">1D</option><option value="1W">1W</option><option value="1M">1M</option>
                    <option value="3M">3M</option><option value="6M">6M</option><option value="1YR">1YR</option>
                    <option value="2YR">2YR</option><option value="3YR">3YR</option><option value="5YR">5YR</option>
                </select>
                <input type="number" id="returnMin" placeholder="Min % (e.g. -5)" style="width: 120px;">
                <span style="font-size: 13px;">to</span>
                <input type="number" id="returnMax" placeholder="Max % (e.g. 10)" style="width: 120px;">
                <button onclick="applyFilter()" style="padding: 6px 12px; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 13px;">Apply Filter</button>
                <button onclick="clearFilter()" style="padding: 6px 12px; background: #e2e8f0; color: #475569; border: none; border-radius: 4px; cursor: pointer; font-size: 13px;">Clear</button>
            </div>
        </div>
    </div>
    <div class="table-container">
        <table id="dataTable">
            <thead>
                <tr>
                    <th onclick="sortTable('Company')">Company/Index <span class="sort-icon"></span></th>
                    <th onclick="sortTable(document.getElementById('weightCloseHeader').dataset.field || 'Weight')" id="weightCloseHeader" data-field="Weight">WEIGHT <span class="sort-icon"></span></th>
                    <th onclick="sortTable('LTP VS 52W HIGH')">LTP VS<br>52W HIGH <span class="sort-icon"></span></th>
                    <th onclick="sortTable('1D')">1D <span class="sort-icon"></span></th>
                    <th onclick="sortTable('1W')">1W <span class="sort-icon"></span></th>
                    <th onclick="sortTable('1M')">1M <span class="sort-icon"></span></th>
                    <th onclick="sortTable('3M')">3M <span class="sort-icon"></span></th>
                    <th onclick="sortTable('6M')">6M <span class="sort-icon"></span></th>
                    <th onclick="sortTable('1YR')">1YR* <span class="sort-icon"></span></th>
                    <th onclick="sortTable('2YR')">2YR* <span class="sort-icon"></span></th>
                    <th onclick="sortTable('3YR')">3YR* <span class="sort-icon"></span></th>
                    <th onclick="sortTable('5YR')">5YR* <span class="sort-icon"></span></th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

            // Dynamic Limits for color heatmapping
            let limit = 0.3; // Default 30% bounds for 1M, 3M, 6M

            if (row.IsIndex) {
                const constituents = rawData.filter(r => !r.IsIndex && r.Category === row.Category);
                const adv = constituents.filter(r => parseForSort(r['1D']) > 0 && parseForSort(r['1D']) !== -999999).length;
                const dec = constituents.filter(r => parseForSort(r['1D']) < 0 && parseForSort(r['1D']) !== -999999).length;
                const total = adv + dec;
                
                let adBarHtml = '';
                if (total > 0 && !isFlat) {
                    adBarHtml = `
                    <div class="ad-bar-container">
                        <div class="ad-bar-track">
                            <div style="width: ${(dec/total)*100}%; background-color: #ef4444;"></div>
                            <div style="width: ${(adv/total)*100}%; background-color: #22c55e;"></div>
                        </div>
                        <div class="ad-labels">
                            <span style="color: #ef4444; font-weight: bold;">${dec}</span>
                            <span style="color: #22c55e; font-weight: bold;">${adv}</span>
                        </div>
                    </div>`;
                }
                
                // Toggle sign on the right side of the cell
                let toggleSign = expandedIndices.has(row.Category) ? '-' : '+';
                let toggleHtml = `<span class="toggle-btn">${toggleSign}</span>`;
                
                companyContent = `
                    <div style="display: flex; justify-content: space-between; align-items: center; min-width: 180px; width: 100%;">
                        <div>
                            <div style="font-weight: 600; color: #0f172a; font-size: 13px; margin-bottom: 2px;">${row.Company}</div>
                            ${adBarHtml}
                        </div>
                        <div style="margin-left: 15px;">${toggleHtml}</div>
                    </div>
                `;
            } else {
                companyContent = `<div style="display: flex; align-items: center; min-width: 180px;">${isFlat ? '' : '<span style="display:inline-block; width: 25px;"></span>'}${row.Link ? `<a href="${row.Link}" target="_blank">${row.Company}</a>` : row.Company}</div>`;
            }
            
            tr.innerHTML = `
                <td>${companyContent}</td>
                <td><span style="color:#64748b;">${isFlat ? ((!row.IsIndex && row.Close != null) ? row.Close.toFixed(2) : '-') : ((!row.IsIndex && row.Weight) ? (row.Weight * 100).toFixed(2) + '%' : '-')}</span></td>
                <td style="background-color: ${getColorForReturn(row['LTP VS 52W HIGH'], 'LTP VS 52W HIGH')}">${formatPercent(row['LTP VS 52W HIGH'])}</td>
                <td style="background-color: ${getColorForReturn(row['1D'], '1D')}">${formatPercent(row['1D'])}</td>
                <td style="background-color: ${getColorForReturn(row['1W'], '1W')}">${formatPercent(row['1W'])}</td>
                <td style="background-color: ${getColorForReturn(row['1M'], '1M')}">${formatPercent(row['1M'])}</td>
                <td style="background-color: ${getColorForReturn(row['3M'], '3M')}">${formatPercent(row['3M'])}</td>
                <td style="background-color: ${getColorForReturn(row['6M'], '6M')}">${formatPercent(row['6M'])}</td>
                <td style="background-color: ${getColorForReturn(row['1YR'], '1YR')}">${formatPercent(row['1YR'])}</td>
                <td style="background-color: ${getColorForReturn(row['2YR'], '2YR')}">${formatPercent(row['2YR'])}</td>
                <td style="background-color: ${getColorForReturn(row['3YR'], '3YR')}">${formatPercent(row['3YR'])}</td>
                <td style="background-color: ${getColorForReturn(row['5YR'], '5YR')}">${formatPercent(row['5YR'])}</td>
            `;
            return tr;
        }

        function sortTable(col) { sortAsc = sortCol === col ? !sortAsc : true; sortCol = col; renderTable(); }
        function updateSortIcons() { document.querySelectorAll('th').forEach(th => { const icon = th.querySelector('.sort-icon'); if (icon) { icon.textContent = ''; if (th.textContent.includes(sortCol)) icon.innerHTML = sortAsc ? '&#9650;' : '&#9660;'; } }); }
        function applyFilter() { isFiltered = true; renderTable(); }
        function clearFilter() { document.getElementById('returnMin').value = ''; document.getElementById('returnMax').value = ''; document.getElementById('searchInput').value = ''; document.getElementById('categoryFilter').value = 'All'; document.getElementById('viewModeFilter').value = 'All'; isFiltered = false; sortCol = null; renderTable(); }

        document.getElementById('searchInput').addEventListener('input', renderTable);
        document.getElementById('categoryFilter').addEventListener('change', renderTable);
        document.getElementById('viewModeFilter').addEventListener('change', renderTable);

        initCategoryFilter(); renderTable();
    </script>
</body>
</html>
